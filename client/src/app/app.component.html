<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <!-- Navigation bar Title -->
    <div class="navbar-text">
      {{'Dubai Blog'}}
    </div>

    <!-- Toggle Navbar Menu Button -->
    <button (click)="isCollapsed = !isCollapsed" class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Links -->
    <div [ngbCollapse]="isCollapsed" class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul ngbNav #nav="ngbNav" [activeId]="route.fragment | async" class="navbar-nav ml-auto">
        <li class="nav-item pl-lg-3" [ngbNavItem]="link.fragment" *ngFor="let link of links">
          <a ngbNavLink [ngClass]="" class="btn btn-outline-primary" routerLink="{{ link.fragment }}" (click)="logout()">{{ link.title }}</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Alert -->
<alert></alert>

<div class="placeholder">
  <div class="inner-placeholder">

    <router-outlet></router-outlet>

    <!-- Footer -->
    <footer *ngIf="!footerExcluded.includes(router.url) && isContentLoaded()" class="page-footer font-small blue">

      <!-- Copyright -->
      <div class="footer-copyright text-center py-3">© 2021 Copyright:
        <a href=""> dubai.blogspot.com</a>
      </div>

    </footer>
  </div>

</div>
